<!doctype html>
<meta charset="utf-8">
<title>SAFIA.OS — mobile viewport harness</title>
<!--
  A REAL 390px VIEWPORT FOR THIS WORLD, under browser automation.

  Chrome's automation tab cannot be resized in a way the page believes:
  `resize_window` leaves `innerWidth` at the desktop value, and `safeZone.mobile`
  is re-derived from `innerWidth` every 200ms inside `measureSafeZone()`, so
  patching the flag from the console is overwritten on the next frame. The
  practical effect was that mobile went unverified — and it was hiding real
  breakage: a CSS specificity collision that had killed the hero's entire
  lighting layer, and an eclipse flash whose gradient only covered the frame at
  landscape aspect.

  An IFRAME has its own viewport. Everything downstream of `innerWidth` — media
  queries, `safeZone.mobile`, the canvas drawing buffer, the camera's aspect —
  follows the frame's 390x844 box, and because it is same-origin the parent can
  reach in and drive it.

  Serve it from the dev server (this file is under `scripts/`, so it is NOT
  copied into the production build the way `public/` is):

      npm run dev
      open http://localhost:5180/scripts/mobile-viewport.html

  Then, from the parent page's console:

      await __mob.go(0.99)        // pin a station, step frames by hand
      await __mob.section('projects')
      __mob.ready()

  rAF is paused outright in a hidden automated tab, so nothing frame-driven runs
  on its own — `go()` and `section()` advance R3F manually and write the station
  into the store rather than waiting for the world driver. `?awake=1` on the
  frame keeps the driver from parking and mounts the world eagerly.
-->
<style>html,body{margin:0;background:#0a0a12}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="m" src="/?awake=1"></iframe>
<script>
window.__mob = {
  w(){ return frames[0] },
  ids:['hero','about','skills','experience','projects','ailab','achievements','contact'],
  anchors(){ const w=this.w(); return this.ids.map(id=>{const el=w.document.getElementById(id); if(!el) return null; const r=el.getBoundingClientRect(); return r.top + w.scrollY + r.height/2}) },
  scrollForStation(s){ const a=this.anchors(); const i=Math.max(0,Math.min(a.length-2,Math.floor(s))); const f=s-i; return a[i]+(a[i+1]-a[i])*f - this.w().innerHeight/2 },
  reveal(){ const w=this.w(); w.document.querySelectorAll('[style*="opacity"]').forEach(e=>{e.style.opacity='';e.style.transform='';e.style.filter=''}) },
  frames(n,s){ const w=this.w(); const S=w.__scrollStores[0]; let t=performance.now();
    for(let i=0;i<n;i++){ t+=16.7; S.setState({station:s,time:S.getState().time+0.0167,ignition:1}); w.__world.advance(t) } },
  async go(s,n=60){ const w=this.w(); w.scrollTo({top:this.scrollForStation(s),behavior:'instant'});
    await new Promise(r=>setTimeout(r,150)); this.frames(n,s); this.reveal();
    return {want:s, station:+w.__scrollStores[0].getState().station.toFixed(3), scrollY:Math.round(w.scrollY)} },
  async section(id,off=0){ const w=this.w(); const el=w.document.getElementById(id);
    const y=el.getBoundingClientRect().top+w.scrollY+off; w.scrollTo({top:y,behavior:'instant'});
    await new Promise(r=>setTimeout(r,400)); this.reveal();
    const a=this.anchors(); const focus=w.scrollY+w.innerHeight/2; let s=a.length-1;
    for(let k=0;k<a.length-1;k++){ if(focus>=a[k]&&focus<a[k+1]){ s=k+(focus-a[k])/(a[k+1]-a[k]); break } }
    this.frames(50,s); this.reveal(); return {id,y:Math.round(y),station:+s.toFixed(2)} },
  ready(){ const w=this.w(); return {iw:w.innerWidth, ih:w.innerHeight, world:!!w.__world, mobile:w.__safeZone&&w.__safeZone.mobile} }
};
</script>
